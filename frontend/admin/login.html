<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | C2T MOBILES</title>
  <link rel="stylesheet" href="../css/style.css?v=20260913_v3">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.25rem;">

  <div style="background: white; width: 100%; max-width: 400px; padding: 2.5rem; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="../index.html" class="brand-logo" style="justify-content: center; display:block; text-align:center; margin-bottom:0.75rem;">
        <img src="../assets/images/c2t_logo.png" alt="C2T MOBILES" style="height:52px; max-width:180px; object-fit:contain; margin:0 auto;">
      </a>
      <h2 style="font-weight: 800; font-size: 1.25rem; color: var(--text-muted);">Owner Admin Portal</h2>
    </div>

    <form id="adminLoginForm">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="username">Admin Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div id="loginError" style="display: none; color: var(--accent-rose); font-size: 0.875rem; font-weight: 700; margin-bottom: 1rem; text-align: center;"></div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%;">Sign In to Dashboard</button>
    </form>
  </div>

  <script src="../js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('adminLoginForm');
      const errorDiv = document.getElementById('loginError');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
          await API.adminLogin(username, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorDiv.textContent = err.message || "Authentication failed";
          errorDiv.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
