<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | C2T MOBILES</title>
  <meta name="description" content="Create an account on C2T MOBILES to browse pre-owned smartphones and talk directly with the owner on WhatsApp.">
  <link rel="stylesheet" href="css/style.css?v=20260913_v3">
  <link rel="stylesheet" href="css/responsive.css?v=20260913_v3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-navy) 100%);
      padding: 1.5rem;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
      border-radius: var(--radius-md);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      margin-top: 0.75rem;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.925rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; display:block; text-align:center;">
          <img src="assets/images/c2t_logo.png" alt="C2T MOBILES" style="height:54px; max-width:200px; object-fit:contain; margin:0 auto;">
        </a>
        <h1>Create Account</h1>
        <p>Join C2T MOBILES for quality second-hand mobile deals.</p>
      </div>

      <form id="userRegisterForm">
        <!-- Clean Vertical Stacked Form Layout: Labels strictly above input boxes -->
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label for="phone">Mobile Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your 10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required minlength="6">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
        </div>

        <div id="registerError" style="display: none; color: var(--accent-rose); font-size: 0.875rem; font-weight: 700; margin-bottom: 1rem; text-align: center;"></div>

        <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Create Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700; color: var(--accent-blue);">Login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('userRegisterForm');
      const errorDiv = document.getElementById('registerError');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';

        const full_name = document.getElementById('full_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();
        const confirm_password = document.getElementById('confirm_password').value.trim();

        if (password !== confirm_password) {
          errorDiv.textContent = "Passwords do not match";
          errorDiv.style.display = 'block';
          return;
        }

        try {
          await API.userRegister({ full_name, email, phone, password, confirm_password });
          window.location.href = 'index.html';
        } catch (err) {
          errorDiv.textContent = err.message || "Registration failed";
          errorDiv.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
